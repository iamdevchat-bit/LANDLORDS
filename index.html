<!DOCTYPE html>
<html>

<head>
    <header>
    
    <img src="WhatsApp Image 2026-09-17 at 2.18.36 AM.jpeg" length="100" width="100">

    </header>
    

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07140d;
            color: white;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            background:
                radial-gradient(circle at 50% 20%, #1d6339, #07140d 55%);
        }

        .content {
            max-width: 900px;
        }

        .logo {
            font-size: 22px;
            letter-spacing: 4px;
            color: #8cffb2;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 70px;
            margin: 0;
        }

        h1 span {
            color: #62ff9b;
        }

        .tagline {
            font-size: 25px;
            margin: 25px 0;
            color: #d5e9dc;
        }

        .description {
            color: #9bb5a4;
            font-size: 17px;
            line-height: 1.7;
        }

        .start-button {
            margin-top: 35px;
            padding: 16px 40px;
            border: none;
            border-radius: 30px;
            background: #62ff9b;
            color: #06100a;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-button:hover {
            transform: scale(1.05);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .feature {
            padding: 18px 25px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
        }

    </style>

</head>


<body>

    <div class="hero">

        <div class="content">

            <div class="logo">
                MAKEYOURPROFIT
            </div>

            <h1>
                See Your Property's
                <span>Future.</span>
            </h1>

            <div class="tagline">
                Don't just analyse real estate.
                Predict what comes next.
            </div>

            <div class="description">

                Explore property potential using
                location, infrastructure, demand,
                connectivity and future scenarios.

            </div>

            <button
                class="start-button"
                onclick="startProject()">

                ENTER THE FUTURE →

            </button>


            <div class="features">

                <div class="feature">
                    🤖 AI Analysis
                </div>

                <div class="feature">
                    📈 Forecasting
                </div>

                <div class="feature">
                    🗺️ Future Mapping
                </div>

                <div class="feature">
                    🚇 What-If Simulation
                </div>

            </div>

        </div>

    </div>


    <script>

        function startProject() {

            window.location.href =
                "property.html";

        }

    </script>

</body>

</html>
