<!DOCTYPE html>
<html>

<head>
    <header>
    
    <img src="WhatsApp Image 2026-09-17 at 2.18.36 AM.jpeg" length="100" width="100">

    </header>

    <title>MakeYourProfit - Property</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #061a12;
            color: white;
        }

        .header {
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #8cffc1;
        }

        .tag {
            color: #9bb8aa;
            font-size: 14px;
        }

        .main {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .box {
            width: 900px;
            max-width: 95%;
            background: #0c2a1e;
            border: 1px solid #285c45;
            border-radius: 25px;
            padding: 45px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 42px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a9c9b8;
            margin-bottom: 35px;
            font-size: 17px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 9px;
            color: #bce8d0;
            font-weight: bold;
        }

        input {
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #376e56;
            background: #071d15;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #8cffc1;
        }

        .upload {
            grid-column: 1 / 3;
        }

        .upload-box {
            border: 2px dashed #4b896c;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            background: #081f16;
        }

        .upload-box input {
            border: none;
            background: transparent;
            width: 100%;
        }

        .button-area {
            margin-top: 35px;
            text-align: center;
        }

        button {
            border: none;
            padding: 17px 40px;
            border-radius: 30px;
            background: #8cffc1;
            color: #062016;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(140,255,193,0.4);
        }

        .note {
            margin-top: 20px;
            text-align: center;
            color: #7fa593;
            font-size: 13px;
        }

        @media(max-width:700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .upload {
                grid-column: auto;
            }

            .box {
                padding: 25px;
            }

            h1 {
                font-size: 32px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            MakeYourProfit
        </div>

        <div class="tag">
            REAL ESTATE • FUTURE INTELLIGENCE
        </div>

    </div>



    <!-- MAIN -->

    <div class="main">

        <div class="box">

            <h1>
                Tell Us About Your Property.
            </h1>

            <div class="subtitle">
                Enter the current details and let our system analyse
                its future potential.
            </div>


            <div class="form-grid">


                <!-- PROPERTY NAME -->

                <div class="field">

                    <label>
                        Property Name
                    </label>

                    <input
                        type="text"
                        id="propertyName"
                        placeholder="Example: Green Valley Residency">

                </div>



                <!-- LOCATION -->

                <div class="field">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Example: Gurugram">

                </div>



                <!-- PRICE -->

                <div class="field">

                    <label>
                        Current Property Price (₹)
                    </label>

                    <input
                        type="number"
                        id="price"
                        placeholder="Example: 5000000">

                </div>



                <!-- AREA -->

                <div class="field">

                    <label>
                        Area (sq.ft.)
                    </label>

                    <input
                        type="number"
                        id="area"
                        placeholder="Example: 1200">

                </div>



                <!-- IMAGE -->

                <div class="field upload">

                    <label>
                        Property Image
                    </label>

                    <div class="upload-box">

                        <input
                            type="file"
                            id="propertyImage"
                            accept="image/*">

                    </div>

                </div>


            </div>



            <!-- BUTTON -->

            <div class="button-area">

                <button onclick="analyseProperty()">

                    ANALYSE MY PROPERTY →

                </button>

            </div>


            <div class="note">

                Your property data will be used to generate
                a future potential analysis.

            </div>


        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script>

        function analyseProperty() {


            // Get values

            const name =
                document.getElementById("propertyName").value.trim();

            const location =
                document.getElementById("location").value.trim();

            const price =
                document.getElementById("price").value.trim();

            const area =
                document.getElementById("area").value.trim();

            const image =
                document.getElementById("propertyImage").files[0];



            // Validation

            if (name === "") {

                alert("Please enter the property name.");

                return;

            }


            if (location === "") {

                alert("Please enter the property location.");

                return;

            }


            if (price === "" || Number(price) <= 0) {

                alert("Please enter a valid property price.");

                return;

            }


            if (area === "" || Number(area) <= 0) {

                alert("Please enter a valid area.");

                return;

            }



            // Save property information

            localStorage.setItem(
                "propertyName",
                name
            );

            localStorage.setItem(
                "propertyLocation",
                location
            );

            localStorage.setItem(
                "propertyPrice",
                price
            );

            localStorage.setItem(
                "propertyArea",
                area
            );



            // Save image

            if (image) {

                const reader =
                    new FileReader();

                reader.onload = function(event) {

                    localStorage.setItem(
                        "propertyImage",
                        event.target.result
                    );

                    window.location.href =
                        "analysis.html";

                };

                reader.readAsDataURL(image);

            }

            else {

                localStorage.removeItem(
                    "propertyImage"
                );

                window.location.href =
                    "analysis.html";

            }

        }

    </script>


</body>

</html>
